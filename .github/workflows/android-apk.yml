name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Production Next.js API base URL (e.g., https://uas.example.com)"
        required: false
        default: ""

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "file:./dev.db"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Java 21 (Zulu, required by Capacitor 8 & AGP 8.13)
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "zulu"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build static Capacitor web bundle (./out)
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ inputs.api_base_url || vars.NEXT_PUBLIC_API_BASE_URL || '' }}
          NEXT_PUBLIC_APP_NAME: "النظام المحاسبي الموحد (UAS)"
        run: npm run build:mobile

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Accept Android SDK licenses and grant gradlew execute permission
        run: |
          if [ -n "$ANDROID_HOME" ]; then
            mkdir -p "$ANDROID_HOME/licenses"
            printf "24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n" > "$ANDROID_HOME/licenses/android-sdk-license"
            SDKMGR=$(command -v sdkmanager || find "$ANDROID_HOME" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)
            if [ -n "$SDKMGR" ]; then
              yes | "$SDKMGR" --licenses > /dev/null || true
            fi
          fi
          chmod +x android/gradlew

      - name: Build Android Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload Android Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: uas-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
