# ==============================================================================
# Unified Accounting System (UAS) - High-Performance Nginx Reverse Proxy Config
# Production Domain: https://qat.world / https://www.qat.world
# Stack: Next.js 16 (Turbopack SSR), Node.js, WebSockets, HTTPS, HTTP/2
# ==============================================================================

upstream uas_upstream {
    server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
    keepalive 64;
}

# 1. HTTP Redirect to HTTPS (Port 80 -> 443)
server {
    listen 80;
    listen [::]:80;
    server_name qat.world www.qat.world;

    # Let's Encrypt ACME challenge directory
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Production HTTPS Server Block (Port 443)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name qat.world www.qat.world;

    # SSL Certificates (Let's Encrypt Standard Paths)
    ssl_certificate /etc/letsencrypt/live/qat.world/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qat.world/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/qat.world/chain.pem;

    # SSL Security & Cipher Suites (Mozilla Modern Recommendation)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_session_cache shared:SSL:50m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Payload & Buffer Limits
    client_max_body_size 50M;
    client_body_buffer_size 128k;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Static Assets Caching (Next.js Built Assets)
    location /_next/static/ {
        alias /var/www/uas-accounting-system/.next/static/;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Public Directory Assets (Icons, Images, Manifest)
    location /public/ {
        alias /var/www/uas-accounting-system/public/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Main Application Proxy (App Router & API Routes)
    location / {
        proxy_pass http://uas_upstream;
        proxy_http_version 1.1;

        # WebSocket & Server-Sent Events (SSE) support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # Client Origin & Host Propagation
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeouts for heavy report generations & accounting exports
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # Buffer Optimization
        proxy_buffering on;
        proxy_buffers 8 16k;
        proxy_buffer_size 32k;
    }
}

